[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow-ai"
version = "0.1.0"
description = "Spatio-temporal predictive analytics starter codebase for Citi Bike urban mobility."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "joblib>=1.3",
  "pyarrow>=14.0",
  "streamlit>=1.35",
  "plotly>=5.20"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
urbanflow = "urbanflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
